exam_code: MRCP_PART1
exam_name: "MRCP(UK) Part 1"
blueprint_source_url: "https://www.thefederation.uk/examinations/part-1/format"   # 2026 blueprint.
                                  # Counts below via studymrcp mirror, cross-checked against Federation
                                  # anchors (Clinical sciences 25, Clinical pharmacology 15, big-four 14);
                                  # sums to exactly 200. Normalized at scoring (S_blueprint, 7%).
mcq_style: best_of_five
negative_marking: false

source_tiers:                      # provenance (which drop) is the prior; per-file classify refines it (C1c)
  past_papers: {tier: 1, tier_weight: 1.00, default_reliability: recall}   # from Papers.zip
  qbanks:      {tier: 2, tier_weight: 0.75, default_reliability: unknown}  # from Qbank.rar
  pearls:      {tier: 3, tier_weight: 0.65, default_reliability: unknown,
                source_salience: 0.75,       # whole book is high-yield by construction (§7 C1c)
                exempt_noise_ceiling: true}  # do NOT zero it for flagging ~everything — that's correct
  textbooks:   {tier: 3, tier_weight: 0.60, default_reliability: unknown}
  references:  {tier: 4, tier_weight: 0.45, default_reliability: unknown}

drops:                             # globs fixed to the ACTUAL dropped filenames (confirmed 2026-07-15)
  - {glob: "Textbook*.zip", default_kinds: [textbook, pearls, reference], classify: per_file}
  - {glob: "Qbank*.rar",    default_kinds: [qbank], subject_from: filename,
     subject_pattern: '^\d+-(?P<subject>.+)\.pdf$'}   # e.g. "1-Cardiology.pdf" (16 subject-wise files)
  - {glob: "Papers*.zip",   default_kinds: [past_paper], require: year_per_file}
                                   # nested archives expected: Papers.zip -> Pastest .rar (~34) + loose;
                                   #   Textbook.zip -> Passmedicine High-Yield .rar (a pearls book)

importance:
  weights: {pyq: 0.33, corrob: 0.24, freq: 0.07, emphasis: 0.11,
            blueprint: 0.07, centrality: 0.06, tier: 0.05, trend: 0.07}   # Σ = 1.00
  emphasis_mix: {my_highlight: 0.6, book_flag: 0.4}   # §5b — both mean "a human marked this"
  recency_lambda: 0.15             # per-year decay on past-paper hits
  recent_window_years: 10          # "still live" window — drives the multi-year floor + fading cap
  thresholds: {five: 0.80, four: 0.62, three: 0.42, two: 0.22}
  cluster_ambiguous_band: [0.82, 0.92]   # only this cosine band goes to opus adjudication
  floors:
    pyq_min_importance: 4
    multi_year_pyq_forces: 5       # requires >=1 hit inside recent_window_years (see SCORING.md)
    uncorroborated_max: 3
    fading_max: 3                  # historically asked, dead since => capped

dossier:                           # §C10 — which canonical concepts get a pre-built "read up on X" page
  min_atoms: 3                     # build a page when the concept has >= this many constituent atoms ...
  min_subjects: 2                  # ... OR spans >= this many subjects (cross-subject is the whole point)
  max_connections: 20             # concept-map edges listed per page (ordered by distinct-source support)
  max_related_mcqs: 30            # linked questions per page (ordered by MCQ importance)
  min_name_len: 4                  # ignore concept names shorter than this when phrase-matching MCQ stems

staleness:
  enabled: true
  guideline_sensitive_cues: ["first-line", "target", "threshold", "recommended", "guideline",
                             "management of", "treatment of", "screening", "cut-off"]

