# StudyFeed — Gradle build properties
#
# NOTE: `org.gradle.java.home` is deliberately NOT set here. It would hardcode this laptop's
# JBR path into a committed file and break every other machine (the compiler still lives on the
# Hetzner box). The JDK is supplied by JAVA_HOME instead — see app/README.md. If you want a
# machine-local override, put it in ~/.gradle/gradle.properties, which is never committed.

# 16GB laptop: leave room for the Kotlin compile daemon + Android Studio.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
