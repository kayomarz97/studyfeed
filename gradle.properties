# StudyFeed — Gradle build properties
#
# NOTE: `org.gradle.java.home` is deliberately NOT set here. It would hardcode one machine's
# JDK path into a committed file and break every other machine. The JDK is supplied by
# JAVA_HOME instead — see app/README.md. If you want a machine-local override, put it in
# ~/.gradle/gradle.properties, which is never committed.

# Leave room for the Kotlin compile daemon + the IDE on a 16GB machine.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
