[project]
name = "studyfeed-compiler"
version = "0.0.1"
description = "Exam-agnostic content-pack compiler for StudyFeed (see ../BUILD_PROMPT.md)."
requires-python = ">=3.11"

# Dependencies are listed WITHOUT hard pins on purpose: per the working agreement we never pick a
# version blind. `uv lock` resolves them and syntax-compatibility-checker / docs-researcher verify the
# API shapes BEFORE the first install (a separate gated step before C2 extraction). The embedding lib
# (fastembed vs sentence-transformers) and Docling version are confirmed at that point.
dependencies = [
    "pymupdf",            # fitz: PDF text + annotations + page geometry (zero-token extraction)
    "docling",            # layout / reading order / OCR (English-only per profile)
    "anthropic",          # Message Batches API (BYOK, build-time only)
    "pyyaml",             # profile loading
    "numpy",
    "networkx",           # PageRank centrality over concept_edges
    "hnswlib",            # ANN index for near-dup clustering (never all-pairs)
    "datasketch",         # MinHash for file-level fuzzy dedupe (§5b)
    "rapidfuzz",          # fast string similarity helpers
    "pillow",             # figure extraction / colour-mask highlight harvesting
    "fastembed",          # local sentence embeddings for clustering (no torch); revisit at C5
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studyfeed_compiler"]

[tool.uv]
# uv-managed; provisions Python 3.11+ even though the system python is 3.10.
